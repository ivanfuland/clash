; A4：出行 / 弱网模式
; 目标：
; - 普通国外流量允许走机场节点兜底
; - AI / 金融账号流量直接 REJECT，避免落到共享机场出口
; - 不引用 Osaka 自建 VPS，降低火车/弱网场景下主力 VPS 反复重连风险

;1、规则基底
;复用 A2 黑名单规则：未知域名默认国内，不自动兜底到机场，避免敏感账号流量漏出。
clash_rule_base=https://raw.githubusercontent.com/ivanfuland/clash/main/Clash-A2-Base.yaml?v=2026-06-16-stash-dns-policy


