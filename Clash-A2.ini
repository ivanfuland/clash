;3、套娃组
;两个入口，结构对称：
;  住宅使用 = select(住宅-稳定, 住宅-手动, 美国-稳定)   —— ISP/CC 身份，服务端转上游住宅代理
;  日常使用 = select(专线-稳定, 专线-手动, 美国-稳定)   —— GIA 身份，服务端直出 VPS
;select 默认选中第一个成员，所以默认行为就是 fallback；需要时再手动切。
custom_proxy_group=住宅使用`select`[]住宅-稳定`[]住宅-手动`[]美国-稳定
custom_proxy_group=日常使用`select`[]专线-稳定`[]专线-手动`[]美国-稳定

