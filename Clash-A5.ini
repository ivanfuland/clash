; A5：双分流黑名单模式
; 国外规则统一进入“国外”，未匹配流量进入“国内”。

;1、规则基底
clash_rule_base=https://raw.githubusercontent.com/ivanfuland/clash/main/Clash-A5-Base.yaml?v=2026-08-10-a5-simple

;2、策略组
; 默认代理直接收录全部节点，由用户手动选择单节点。
custom_proxy_group=🔰 默认代理`select`.*
custom_proxy_group=🌐 国外`select`[]🔰 默认代理
custom_proxy_group=🏠 国内`select`[]DIRECT

;3、规则生成
; GEOSITE/GEOIP 直接使用 clash_rule_base 中的原生 Mihomo 规则。
enable_rule_generator=false
overwrite_original_rules=false
